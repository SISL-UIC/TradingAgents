name: CI
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        include:
        - python-version: '3.10'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install (with dev extras)
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Run test suite
      run: pytest -q
    timeout-minutes: 6
  smoke-install:
    name: clean-install smoke
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Fresh install (no dev extras) and import
      run: |
        python -m pip install --upgrade pip
        pip install .
        # Catches undeclared runtime deps (e.g. #994 python-dotenv): a bare
        # install must import the package and the CLI module.
        python -c "import tradingagents, cli.main; print('clean-install import OK')"
    timeout-minutes: 6
  lint:
    name: ruff (strict, full repo)
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install ruff
      run: pip install "ruff>=0.15"
    - name: Lint the repository
      run: ruff check .
    timeout-minutes: 6
env:
  PYTHONPATH: /tmp/instr
  BASH_ENV: /tmp/instr/bash_env.sh
'on':
  push:
    branches:
    - main
  pull_request: null
